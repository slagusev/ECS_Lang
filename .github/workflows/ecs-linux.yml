name: ECSLang Linux CI (B5.2-lite)

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    # Nightly drift-detection run at 03:00 UTC
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  verify-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Install Clang / LLVM (Host Native Toolchain)
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libomp-dev

      - name: Build Solution in Release mode
        run: |
          dotnet build -c Release

      - name: Verify Cross-Host Determinism (Strict Golden IR 7/7 from Linux Host)
        shell: pwsh
        run: |
          pwsh -File tests/verify_golden_ir.ps1 -Mode strict -CliPath src/ECSLang.CLI/bin/Release/net9.0/ECSLang.CLI.dll

      - name: Run AddressSanitizer (ASan) Verification Suite
        shell: pwsh
        run: |
          pwsh -File tests/run_asan_linux.ps1 -CliDll src/ECSLang.CLI/bin/Release/net9.0/ECSLang.CLI.dll

      - name: Run ThreadSanitizer (TSan) Verification Suite
        shell: pwsh
        run: |
          pwsh -File tests/run_tsan_linux.ps1 -CliDll src/ECSLang.CLI/bin/Release/net9.0/ECSLang.CLI.dll

